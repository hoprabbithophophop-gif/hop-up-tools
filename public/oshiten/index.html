<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>推しに転生（一時的）したので、ヲタク知識でお見送り会300枚を乗り切る</title><meta name="description" content="お見送り会をアイドル視点で体験したいなと思って作りました。来てくれた人に手を振ったり、話しかけてくれた人に返したりします。スマホで遊べます。"><meta property="og:type" content="website"><meta property="og:url" content="https://hop-up-tools.pages.dev/oshiten/"><meta property="og:title" content="推しに転生（一時的）したので、ヲタク知識でお見送り会300枚を乗り切る"><meta property="og:description" content="お見送り会をアイドル視点で体験したいなと思って作りました。来てくれた人に手を振ったり、話しかけてくれた人に返したりします。スマホで遊べます。"><meta property="og:image" content="https://hop-up-tools.pages.dev/ogp/oshiten.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--mc:#E84C7A;--mc2:#FFD3E0;--ink:#2B2540;--paper:#FFFDF8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1c1a24;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
#app{position:relative;margin:0 auto;max-width:480px;height:100dvh;min-height:520px;overflow:hidden;background:#EFEAF2;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.scr[hidden]{display:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #6B5BD6;outline-offset:2px}
/* タイトル */
@keyframes tin{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes slam{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:none}}
@keyframes late{0%{opacity:0;transform:translateX(140px)}60%{opacity:1;transform:translateX(-22px)}100%{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-14deg)}to{opacity:1;transform:rotate(-6deg)}}
.big{background:var(--mc);color:#fff;font-weight:800;font-size:18px;padding:14px 44px;border-radius:999px;min-height:52px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.sub{background:transparent;color:inherit;font-size:13px;opacity:.75;padding:10px 14px;text-decoration:underline;min-height:44px}
/* 文面の場面 */
.story{justify-content:flex-end;padding:0;cursor:pointer}
.bg{position:absolute;inset:0;z-index:0}
.bg.mall{background:linear-gradient(#DCEBF7 0,#F4EEE6 46%,#E9DFD2 46%,#F6F0E8 100%)}
.bg.mall::before{content:"";position:absolute;left:0;right:0;top:12%;height:20%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 18%,rgba(180,200,220,.5) 18% 20%)}
.bg.mall::after{content:"";position:absolute;left:0;right:0;top:38%;height:6px;background:rgba(120,110,130,.35);box-shadow:0 14px 0 rgba(120,110,130,.18)}
.bg.room{background:linear-gradient(#E8E9EC,#CFD1D6)}
.bg.out{background:linear-gradient(#CFE3F3,#F3ECE1 60%,#D9D2C6)}
.bg.dark{background:#17141f}
.dlg{position:relative;z-index:2;margin:0 12px 18px;background:var(--paper);border-radius:18px;padding:16px 16px 22px;min-height:132px;box-shadow:0 8px 24px rgba(40,30,60,.18);font-size:17px;line-height:1.7;font-weight:600;text-wrap:pretty}
.dlg .who{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#6B6480;border-radius:999px;padding:1px 10px;margin-bottom:6px}
.dlg .who:empty{display:none}
.dlg .nx{position:absolute;right:14px;bottom:8px;font-size:12px;opacity:.5}
.dark .dlg,.dlg.night{background:#262233;color:#F3EEF8}
.choices{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;margin:0 12px 18px}
.choices button{background:var(--paper);border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;min-height:52px;text-align:left;box-shadow:0 4px 0 rgba(40,30,60,.16)}
.choices button:active{transform:translateY(2px)}
.choices button.pri{background:var(--mc);color:#fff;text-align:center}
.cardsDemo{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 10px;opacity:0;transition:opacity .4s}
.cardsDemo.show{opacity:1}
.cardsDemo div{background:#fff;border-radius:12px;padding:10px;text-align:center;font-weight:800;box-shadow:0 0 0 3px var(--mc2);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--mc),0 0 18px var(--mc)}}
/* 本編 */
#main{background:#F4EEE6}
#stage{position:relative;flex:0 0 60%;overflow:hidden}
#stage .bg{pointer-events:none}
.fan{position:absolute;bottom:9%;width:min(70%,340px);left:112%;transform:translateX(-50%);z-index:2;will-change:left,transform}
.fan svg{display:block;width:100%;height:auto;overflow:visible}
.fan .fing{position:absolute;left:66%;top:30%;width:20%;pointer-events:none;z-index:3;filter:drop-shadow(0 2px 3px rgba(40,30,60,.3));animation:fing 1s ease-in-out infinite;transform-origin:30% 0}
.fan .fing svg{width:100%}
@keyframes fing{0%,100%{transform:translate(0,-14%) scale(1)}45%{transform:translate(0,0) scale(.9)}60%{transform:translate(0,0) scale(.9)}}
@media (prefers-reduced-motion:reduce){.fan .fing{animation:none}}
.fan.kid{width:min(60%,290px)}
.fan.mcp svg{animation:mcp 1.05s ease-in-out infinite}
@keyframes mcp{0%,100%{transform:scale(1);filter:none}18%{transform:scale(calc(1 + .03*var(--pulse,1)));filter:drop-shadow(0 0 calc(10px*var(--pulse,1)) var(--mc))}36%{transform:scale(1)}50%{transform:scale(calc(1 + .018*var(--pulse,1)))}}
#table{position:absolute;left:0;right:0;bottom:0;height:12%;z-index:3;background:linear-gradient(#fff,#EDE6F0);border-top:4px solid var(--mc);box-shadow:0 -6px 14px rgba(40,30,60,.12)}
#bubble{position:absolute;left:74px;right:70px;top:8px;z-index:5;background:#fff;border-radius:16px;padding:10px 14px;font-size:17px;font-weight:800;line-height:1.5;box-shadow:0 4px 14px rgba(40,30,60,.18);min-height:46px;opacity:0;transition:opacity .15s}
#bubble.show{opacity:1}
#mgr{position:absolute;right:-64px;top:6px;width:132px;z-index:4;transition:right .25s ease,transform .25s ease;pointer-events:none;filter:saturate(.9)}
#mgr svg{display:block;width:100%;height:auto}
#mgr.peek{right:-52px}
#mgr.glare{right:-22px;transform:rotate(-4deg)}
#mgr.glare::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 40% 40%,rgba(0,0,0,.0),rgba(40,0,20,.18));border-radius:50%}
#ctl{position:relative;flex:1;display:flex;flex-direction:column;background:linear-gradient(#FBF7F2,#F1EAF4);border-top:1px solid rgba(40,30,60,.08);min-height:0}
#inner{padding:8px 14px 2px;font-size:14.5px;font-weight:700;line-height:1.5;min-height:48px;color:#4A4460;text-wrap:pretty}
#memo{padding:0 14px 4px;font-size:13px;line-height:1.45;min-height:22px;color:#7A7390}
#wave{position:relative;flex:1;margin:0 10px 10px;border-radius:18px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:800;color:rgba(232,76,122,.75);font-size:15px;overflow:hidden;min-height:110px}

#wave .hint{display:none}
#cards{position:absolute;inset:0;padding:6px;background:#F6EEF4;border-radius:16px;display:none;grid-template-columns:1fr 1fr;gap:8px;z-index:2}
#cards.show{display:grid}
#cards button{color:var(--ink);background:#fff;border-radius:14px;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(40,30,60,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px}
#cards button small{font-weight:600;font-size:11px;opacity:.6}
#cards button:active{transform:translateY(2px);background:var(--mc2)}
#hands{position:absolute;left:0;right:0;bottom:-4px;z-index:6;pointer-events:none;height:46%;transition:translate .14s ease-out}
#hands svg{position:absolute;bottom:-70%;width:44%;transition:bottom .12s ease-out}
#hands .hl{left:2%}#hands .hr{right:2%;transform:scaleX(-1)}
#hands.two svg{bottom:-8%;animation:wv .24s ease-in-out 2 alternate}
#hands.one .hr{bottom:-2%;animation:wv .28s ease-in-out 2 alternate}
@keyframes wv{from{rotate:-9deg}to{rotate:9deg}}
#stars{position:absolute;right:8%;top:22%;z-index:6;font-size:30px;opacity:0;pointer-events:none;color:var(--mc)}
#stars.go{animation:st .7s ease-out}
@keyframes st{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.2) rotate(12deg)}100%{opacity:0;transform:scale(1.5) rotate(30deg)}}
#quit{position:absolute;left:8px;top:8px;z-index:7;background:rgba(255,255,255,.7);border-radius:999px;font-size:12px;padding:6px 10px;min-height:32px;opacity:.7}
#over{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:flex-end;background:rgba(30,24,44,.28)}
#over.show{display:flex}
#over.soft{background:rgba(255,246,236,.24)}
#main.open #over{pointer-events:none}#main.open #over .dlg{pointer-events:auto}
/* 結果 */
#result{background:linear-gradient(#FFF7EF,#F3ECF6);padding:22px 18px;overflow:auto}
#result h2{margin:6px 0 2px;font-size:22px}
#result .lead{font-size:13px;opacity:.7;margin:0 0 14px}
#result dl{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0 0 16px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(40,30,60,.08)}
#result dt{font-size:14px}#result dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
#result .score{font-size:44px;font-weight:900;color:var(--mc);text-align:center;margin:4px 0 16px;font-variant-numeric:tabular-nums}
#result .score small{font-size:14px;color:var(--ink);font-weight:700;display:block}
#result .row{display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){#title .pen,.cardsDemo div,.fan.mcp svg{animation:none!important}}

#mcchip{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:10px;background:#fff;color:#2a2233;font-weight:800;font-size:15px;padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .4s;pointer-events:none}
#mcchip.show{opacity:1}#mcchip i{width:26px;height:26px;border-radius:50%;background:#E84C7A;display:block}
.fan.glad{filter:brightness(1.08)}

#qcv{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#sq{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#sq[hidden]{display:none}

.fan .stp{animation:step var(--sp,.52s) ease-in-out infinite;transform-origin:50% 100%}
@keyframes step{0%,100%{transform:translateY(0) rotate(-1.3deg)}50%{transform:translateY(-7px) rotate(1.3deg)}}
.fan.waved{filter:brightness(1.04)}
@media (prefers-reduced-motion:reduce){.fan .stp{animation:none}}

.fan .stp{position:relative}
.fan.shy .stp{animation-name:stepShy;animation-duration:1.05s}
@keyframes stepShy{0%,55%,100%{transform:translateY(0) rotate(1.6deg)}25%{transform:translateY(-3px) rotate(.6deg)}75%{transform:translateY(-2px) rotate(2.2deg)}}
.fan.easy .stp{animation-name:stepEasy}
@keyframes stepEasy{0%,100%{transform:translateY(0) rotate(-1.8deg)}50%{transform:translateY(-11px) rotate(1.8deg)}}
.fan.pal .stp{animation-name:stepEasy;animation-duration:.4s!important;animation-delay:0s!important}
.fan .hi{position:absolute;left:67%;top:41%;width:19%;transform-origin:50% 100%;animation:hiw .42s ease-in-out infinite alternate;filter:drop-shadow(0 2px 3px rgba(40,30,60,.25))}
.fan .hi svg{width:100%;height:auto;display:block}
@keyframes hiw{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
@media (prefers-reduced-motion:reduce){.fan .hi{animation:none}}

/* 始めやすさ */
*{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{-webkit-text-size-adjust:100%;touch-action:manipulation}
.scr:not([hidden]){animation:scrIn .38s ease both}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
#ctl{padding-bottom:env(safe-area-inset-bottom)}
#quit{transition:background .2s}#quit[data-arm]{background:#E84C7A;color:#fff}
#wave .rip{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid rgba(232,76,122,.75);pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{to{transform:scale(4.2);opacity:0}}
#wave .hint{position:relative}

@keyframes hintp{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.2);opacity:0}}
#pause,#rot{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(28,24,40,.72);color:#fff;text-align:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#pause.show{display:flex;cursor:pointer}
#pause b{display:block;font-size:22px;margin-bottom:8px}#pause span{font-size:14px;opacity:.85}
#tbtn{gap:0}#tbtn .sub{min-height:36px;padding:6px 14px}
@media (orientation:landscape) and (max-height:520px){#rot{display:flex;position:fixed;font-weight:800;font-size:16px}}
@media (prefers-reduced-motion:reduce){.scr:not([hidden]){animation:none}}

/* 文字はまとめて出す */
.pop{animation:popIn .16s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
#bubble{text-wrap:balance}
#inner,#memo,.dlg .tx{text-wrap:pretty}
/* あの子の指示：左から飛んでくる */
#guide{position:absolute;left:12px;right:12px;top:-26px;z-index:7;background:#E84C7A;color:#fff;border-radius:14px;padding:6px 13px 8px;font-weight:800;font-size:15.5px;line-height:1.45;box-shadow:0 10px 22px rgba(40,20,60,.28),0 2px 5px rgba(40,20,60,.18);transform:translateY(6px);opacity:0;transition:transform .32s cubic-bezier(.2,1.3,.4,1),opacity .2s;pointer-events:none;text-wrap:balance}
#guide.show{transform:translateY(-3px);opacity:1}
#inner,#memo{transition:opacity .2s}#ctl:has(#guide.show) #inner,#ctl:has(#guide.show) #memo{opacity:0}
#guide small{display:block;font-size:10.5px;font-weight:700;opacity:.85;margin-bottom:1px}

.ph{display:inline-block}
/* 背の低い画面でも、客の顔がマネージャーや吹き出しに隠れない大きさにする */
.fan{width:min(70%,340px,33dvh)}
.fan.kid{width:min(60%,290px,28dvh)}
#mgr{--mw:min(132px,15dvh);width:var(--mw);right:calc(var(--mw)*-.5)}
#mgr.peek{right:calc(var(--mw)*-.4)}
#mgr.glare{right:calc(var(--mw)*-.17)}

/* 話しかけながら流されていく人：後ろ髪を引かれるように少しこちらへ傾く */
.fan.cling .stp{animation-name:stepCling}
@keyframes stepCling{0%,100%{transform:translateY(0) rotate(3deg)}50%{transform:translateY(-6px) rotate(5.5deg)}}
/* おまいつ5人 */
#omai{position:absolute;left:0;right:0;top:0;height:100%;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(28,24,40,.82);color:#fff;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s;padding:10px}
#omai.show{opacity:1}
#omai b{font-size:16px}#omai small{font-size:12.5px;opacity:.9}
#omai .fs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:330px}
#omai .fs div{width:min(29%,96px);aspect-ratio:88/100;border-radius:14px;overflow:hidden;background:#EFEAF2;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#omai .fs svg{width:100%;height:100%;display:block}
/* 振り返り */
#rrev{margin-top:22px;padding-bottom:30px}
#rrev h3{font-size:16px;margin:0 0 10px}
#rrev .rv{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 8px rgba(40,30,60,.08)}
#rrev .fc{flex:none;width:52px;aspect-ratio:88/100;border-radius:10px;overflow:hidden;background:#EFEAF2}
#rrev .fc svg{width:100%;height:100%;display:block}
#rrev .bd{display:flex;flex-direction:column;gap:2px;font-size:12.5px;line-height:1.45;min-width:0}
#rrev .bd b{font-size:13.5px}
#rrev .bd span{color:#6B6480}
#rrev i{font-style:normal;font-weight:800}
#rrev .ng{color:#9A93AD}#rrev .ok{color:#E84C7A}
#rrev .more{font-size:13px;color:#6B6480}

/* メンバーカラーを選べるように：決め打ちのピンクを差し替え */
:root{--mct:#fff}
.big,.choices button.pri{color:var(--mct)}
#mcchip i,#quit[data-arm],#guide{background:var(--mc)}
#quit[data-arm],#guide{color:var(--mct)}
#rrev .ok{color:var(--mc)}
#wave{color:color-mix(in srgb,var(--mc) 78%,#2B2540)}
#wave .rip{border-color:color-mix(in srgb,var(--mc) 75%,transparent)}

#mcrow{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:8px;background:rgba(255,255,255,.86);border-radius:16px;padding:6px 12px 8px;box-shadow:0 3px 10px rgba(40,30,60,.12)}
#mcrow span{font-size:11.5px;font-weight:800;color:#2B2540}
#mcpick{display:flex;gap:7px}
#mcpick button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(40,30,60,.18);padding:0}
#mcpick button.on{box-shadow:0 0 0 3px #2B2540;transform:scale(1.12)}

#omai .fs div{aspect-ratio:126/128}
#rrev .fc{aspect-ratio:126/124}


/* タイトルの飾り：跳ねる5人 */
#hoppers{display:flex;justify-content:center;gap:6px;height:46px;margin-bottom:-12px;pointer-events:none}
#hoppers i{display:block;width:44px;height:58px;animation:hop .62s cubic-bezier(.3,0,.4,1) infinite alternate;transform-origin:50% 100%}
#hoppers svg{width:100%;height:100%;display:block}
@keyframes hop{0%{transform:translateY(8px) scale(1.04,.94)}35%{transform:translateY(4px) scale(1,1)}100%{transform:translateY(calc(var(--hh,10px)*-1)) scale(.98,1.03)}}
#start{position:relative;z-index:1}
#tsub{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
#mcrow{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){#hoppers i{animation:none}}

#hoppers{height:62px;gap:4px;margin-bottom:-18px}
#hoppers i{width:60px;height:80px}

/* タイトルのまわりに散らした5人（飾り） */
#scat{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#scat.show{opacity:1}
#scat i{position:absolute;display:block;border-radius:50%;overflow:hidden;background:#F1EAF4;border:3px solid #fff;box-shadow:3px 4px 0 rgba(32,34,74,.85);animation:hop2 .66s cubic-bezier(.3,0,.4,1) infinite alternate}
#scat svg{width:100%;height:100%;display:block}
@keyframes hop2{0%{transform:translateY(5px) rotate(var(--r,0deg)) scale(1.03,.96)}100%{transform:translateY(calc(var(--hh,10px)*-1)) rotate(var(--r,0deg)) scale(.99,1.02)}}
@media (prefers-reduced-motion:reduce){#scat i{animation:none;transform:rotate(var(--r,0deg))}}

/* 散らした5人：枠なしの上半身。各自のタイミングで跳ねる */
#scat i{border:0;border-radius:0;background:none;box-shadow:none;overflow:visible;animation-name:hop3;-webkit-mask-image:linear-gradient(#000 78%,transparent 99%);mask-image:linear-gradient(#000 78%,transparent 99%)}
@keyframes hop3{0%{transform:translateY(6px) scale(1.03,.96)}30%{transform:translateY(2px)}100%{transform:translateY(calc(var(--hh,12px)*-1)) scale(.99,1.02)}}
#tbtn{z-index:5}

#scat i{-webkit-mask-image:linear-gradient(#000 86%,transparent 100%);mask-image:linear-gradient(#000 86%,transparent 100%)}

:root{--mcd:var(--mc)}
#rscore,#rrev .ok{color:var(--mcd)}
#wave{color:color-mix(in srgb,var(--mcd) 80%,#2B2540)}

/* 推しの言葉に合う札を、言葉を使わずに知らせる */
#cards button.tip,#cards.tipall button{animation:tipc .7s ease-in-out infinite alternate}
@keyframes tipc{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--mc) 70%,transparent)}to{box-shadow:0 0 0 6px color-mix(in srgb,var(--mc) 45%,transparent);transform:translateY(-2px)}}
.fan.tapme .stp::after{content:"";position:absolute;left:50%;top:70%;width:34%;aspect-ratio:1;margin-left:-17%;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--mc) 80%,transparent);animation:hintp 1.1s ease-out infinite;pointer-events:none}

#fit{
