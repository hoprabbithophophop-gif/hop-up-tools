# 本番の fc-ticket を毎日1回開き、申込期間バーが出ているかを数える見張り。
# 落ちると GitHub が持ち主へ失敗を知らせる。DISCORD_WEBHOOK_URL を Secrets に置けば Discord にも届く（無くても動く）。
# 収集（GAS）の後に走らせる。cron は UTC。
name: fc-ticket watch

on:
  schedule:
    - cron: '17 22 * * *'   # 07:17 JST。毎時00分は GitHub が混雑帯と明記しているので外す
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/watch-fc-ticket.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
