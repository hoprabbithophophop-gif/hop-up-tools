<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #f8f9fa; }
.wrap {
  width: 1200px;
  height: 630px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  overflow: hidden;
}
.hand-bg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 1;
  pointer-events: none;
  display: block;
}
.title {
  font-family: 'Inter', 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 108px;
  letter-spacing: -0.04em;
  color: #000000;
  position: relative;
  z-index: 1;
  line-height: 1;
  white-space: nowrap;
}
.subtitle {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 58px;
  letter-spacing: -0.02em;
  color: #000000;
  position: relative;
  z-index: 1;
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 14px;
  white-space: nowrap;
}

.credit {
  position: absolute;
  bottom: 24px;
  right: 32px;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(0, 0, 0, 0.35);
  z-index: 1;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- background hand (low opacity ghost) -->
  <svg class="hand-bg" width="700" height="700" viewBox="0 0 512 512" aria-hidden="true">
    <path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 208c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-176c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 272c0 1.5 0 3.1 .1 4.6L67.6 283c-16-15.2-41.3-14.6-56.6 1.4S-3.6 325.7 12.4 341L124.8 448c43.1 41.1 100.4 64 160 64l19.2 0c97.2 0 176-78.8 176-176l0-208c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 112c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-176c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 176c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-208z" fill="#ffffff"/>
  </svg>

  <!-- line 1 -->
  <div class="title">ハイ！テンション</div>

  <!-- line 2: hand icon + text -->
  <div class="subtitle">
    <svg width="52" height="52" viewBox="0 0 512 512" aria-hidden="true" style="flex-shrink:0">
      <path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 208c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-176c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 272c0 1.5 0 3.1 .1 4.6L67.6 283c-16-15.2-41.3-14.6-56.6 1.4S-3.6 325.7 12.4 341L124.8 448c43.1 41.1 100.4 64 160 64l19.2 0c97.2 0 176-78.8 176-176l0-208c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 112c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-176c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 176c0 8.8-7.2 16-16 16s-16-7.2-16-16l0-208z" fill="#000000"/>
    </svg>
    Practice ver.
  </div>

  <!-- credit -->
  <div class="credit">Unofficial Fan Tool</div>

</div>
<script>
document.fonts.ready.then(() => {
  let TARGET = 1200 * 0.93; // 93% of card width

  function fitToWidth(el) {
    let size = 40;
    el.style.fontSize = size + 'px';
    while (el.getBoundingClientRect().width < TARGET && size < 500) {
      size += 2;
      el.style.fontSize = size + 'px';
    }
    // step back 1px to avoid overflow
    while (el.getBoundingClientRect().width > TARGET && size > 40) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
    return size;
  }

  const titleEl = document.querySelector('.title');
  fitToWidth(titleEl);

  const subtitleEl = document.querySelector('.subtitle');
  TARGET = 1200 * 0.80;
  const subSize = fitToWidth(subtitleEl);
  // sync icon size to font size
  const icon = subtitleEl.querySelector('svg');
  icon.setAttribute('width', Math.round(subSize * 0.85));
  icon.setAttribute('height', Math.round(subSize * 0.85));
});
</script>
</body>
</html>
